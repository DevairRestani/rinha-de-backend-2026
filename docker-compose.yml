version: "3.8"
services:
  api1:
    image: sua-imagem:latest
    hostname: api1
    depends_on:
      - db
    environment:
      - DB_HOST=db
    deploy:
      resources:
        limits:
          cpus: "0.30"
          memory: "90MB"
    networks:
      - rinha-net
  api2:
    image: sua-imagem:latest
    hostname: api2
    depends_on:
      - db
    environment:
      - DB_HOST=db
    deploy:
      resources:
        limits:
          cpus: "0.30"
          memory: "90MB"
    networks:
      - rinha-net
  nginx:
    image: nginx:latest
    ports:
      - "9999:9999"
    depends_on:
      - api1
      - api2
    deploy:
      resources:
        limits:
          cpus: "0.15"
          memory: "30MB"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - rinha-net
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rinha
      POSTGRES_PASSWORD: rinha
      POSTGRES_DB: rinha
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: "140MB"
    networks:
      - rinha-net
networks:
  rinha-net:
    driver: bridge