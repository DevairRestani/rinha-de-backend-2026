services:
  api1:
    build: ./src
    image: rinha-fraud:latest
    hostname: api1
    deploy:
      resources:
        limits:
          cpus: "0.425"
          memory: "160MB"
    networks:
      - rinha-net
  api2:
    build: ./src
    image: rinha-fraud:latest
    hostname: api2
    deploy:
      resources:
        limits:
          cpus: "0.425"
          memory: "160MB"
    networks:
      - rinha-net
  nginx:
    image: nginx:latest
    ports:
      - "9999:9999"
    depends_on:
      - api1
      - api2
    deploy:
      resources:
        limits:
          cpus: "0.15"
          memory: "30MB"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - rinha-net
networks:
  rinha-net:
    driver: bridge
